# SonarCloud automatic-analysis scope (ADR-0079). Same rule as the CodeQL config
# (.github/codeql/codeql-config.yml): analyse the code we hand-author for
# production, skip what we deliberately keep verbatim or never edit.
#
# - docs/design-system/**   the design-tool export (bundle, generated runtime,
#                           ui-kit prototypes) — kept as-delivered and already
#                           prettier/eslint/CodeQL-ignored; regenerated, not edited.
# - apps/api/src/db/migrations/**  drizzle-kit output; an applied migration is
#                           immutable (forward-only), so a finding there can only
#                           be addressed by a new migration, never an edit.
# - spikes/**, **/dist/**   throwaway spikes and build output.
sonar.exclusions=docs/design-system/**,apps/api/src/db/migrations/**,spikes/**,**/dist/**
