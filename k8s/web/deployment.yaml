apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Least privilege (ADR-0078 #5). The nginx master starts as root and drops
      # its workers to the `nginx` user, so it keeps exactly the four capabilities
      # that needs; everything else is dropped, the root filesystem is read-only
      # and nginx's writable paths are emptyDirs. Verified with docker run
      # --read-only --cap-drop ALL (+ these four) --security-opt no-new-privileges.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Bootstrap tag; the deploy workflow pins the exact SHA via `kubectl set image`.
          image: ghcr.io/nexushero/mydevtime-web:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
              add: ['CHOWN', 'SETUID', 'SETGID', 'NET_BIND_SERVICE']
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
