# glob patterns we author, never user input; never shipped.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces via micromatch in jest/metro/expo build tooling — no fix released, patterns are ours, never shipped (docs/security/audit-exceptions.md)"

