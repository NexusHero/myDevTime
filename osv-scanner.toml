# ours, never user input, and none ships. The glob/minimatch fixes are new majors
# (14 / 11) their parents do not accept; picomatch has no fixed release. The one
# shipped copy — glob under @fastify/static in the API — is lifted to glob@14 by a
# `resolutions` override instead.
[[IgnoredVulns]]
