version: 2
updates:
  # npm updates come from Renovate (renovate.json), which understands Expo SDK-bound
  # packages; Dependabot keeps the security alerts and the GitHub Actions bumps.
  # Actions are pinned to commit SHAs with the version in a trailing comment
  # (ADR-0078); Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
