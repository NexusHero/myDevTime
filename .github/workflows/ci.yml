name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One in-flight run per ref; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Local gate (format · lint · typecheck · tests · docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the gate
        run: ./test.sh

      - name: Emit OpenAPI spec
        # The script runs in the package dir (apps/api); default output is
        # apps/api/openapi.json, which the upload step below picks up.
        run: pnpm --filter @mydevtime/api openapi:emit

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi
          path: apps/api/openapi.json

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mydevtime
          POSTGRES_PASSWORD: mydevtime
          POSTGRES_DB: mydevtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydevtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mydevtime:mydevtime@localhost:5432/mydevtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/api tests import @mydevtime/domain through its built dist entrypoint.
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Apply migrations
        run: pnpm --filter @mydevtime/api db:migrate

      - name: Run tests against Postgres
        run: pnpm test

  commitlint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/check-conventional-commits.sh "origin/$BASE_REF" "$HEAD_SHA"
