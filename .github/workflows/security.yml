name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  # Dependency vulnerability gate. `pnpm audit` was retired here (2026-07): npm
  # returned HTTP 410 for its audit endpoints ("use the bulk advisory endpoint"),
  # breaking `pnpm audit` registry-wide. OSV-Scanner reads the lockfile and queries
  # the OSV database directly, so it does not depend on the npm audit endpoint.
  # Accepted advisories (Expo build-CLI `tar` only, never shipped) are allowlisted
  # in `osv-scanner.toml` and documented, with a revisit trigger, in
  # docs/security/audit-exceptions.md.
  audit:
    name: OSV vulnerability scan (dependencies)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
        --config=./osv-scanner.toml
      fail-on-vuln: true

  # Secret scanning (ADR-0078 #2): every commit in the history, not just the diff —
  # a key committed and "removed" later is still public. The image is pinned by
  # digest; config and the empty-allowlist policy live in .gitleaks.toml.
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --config .gitleaks.toml --redact --no-banner --verbose

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires the repository Dependency Graph (Settings → Code security).
    # Informational (continue-on-error) until that is enabled.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high
