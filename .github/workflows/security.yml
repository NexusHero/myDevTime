name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  # Dependency vulnerability gate. `pnpm audit` was retired here (2026-07): npm
  # returned HTTP 410 for its audit endpoints ("use the bulk advisory endpoint"),
  # breaking `pnpm audit` registry-wide. OSV-Scanner reads the lockfile and queries
  # the OSV database directly, so it does not depend on the npm audit endpoint.
  # Accepted advisories (Expo build-CLI `tar` only, never shipped) are allowlisted
  # in `osv-scanner.toml` and documented, with a revisit trigger, in
  # docs/security/audit-exceptions.md.
  audit:
    name: OSV vulnerability scan (dependencies)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
        --config=./osv-scanner.toml
      fail-on-vuln: true

  # Secret scanning (ADR-0078 #2): every commit in the history, not just the diff —
  # a key committed and "removed" later is still public. The image is pinned by
  # digest; config and the empty-allowlist policy live in .gitleaks.toml.
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan every commit for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --config .gitleaks.toml --redact --no-banner --verbose

  # Workflow hardening gate (ADR-0078 #3): the workflows hold the deploy credentials,
  # so they are code to audit — unpinned actions, template injection, credential
  # persistence, cache poisoning, excessive permissions. Online mode, so zizmor can
  # also verify that every pinned SHA really belongs to the action it claims to be.
  workflows:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --format=github .github/workflows

  # IaC gate (ADR-0078 #5): Dockerfiles and Kubernetes manifests. Accepted findings
  # are path-scoped, with reasons, in trivy-iac-ignore.yaml.
  iac:
    name: IaC scan (Dockerfiles, k8s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Dockerfiles and k8s manifests
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          config --exit-code 1 --severity HIGH,CRITICAL
          --ignorefile trivy-iac-ignore.yaml .

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires the repository Dependency Graph (Settings → Code security).
    # Informational (continue-on-error) until that is enabled.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
